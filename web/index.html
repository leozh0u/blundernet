<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlunderNet</title>
    <meta
      name="description"
      content="Six million chess puzzles you can filter, a bot that matches your level, and an explanation after every puzzle."
    />
    <!-- Real files at stable URLs, not a data: URI. The inline SVG that used
         to live here rendered fine in a browser tab and was invisible to
         Google, which will not read a data: URI favicon and fell back to the
         generic globe in search results for months. /favicon.ico is the one
         Googlebot asks for by name, and 48 is the size it prefers. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BlunderNet" />
    <meta property="og:title" content="BlunderNet" />
    <meta
      property="og:description"
      content="Six million chess puzzles you can filter, a bot that matches your level, and an explanation after every puzzle."
    />
    <meta property="og:url" content="https://blundernet.com" />
    <meta property="og:image" content="https://blundernet.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BlunderNet" />
    <meta
      name="twitter:description"
      content="Six million chess puzzles you can filter, a bot that matches your level, and an explanation after every puzzle."
    />
    <meta name="twitter:image" content="https://blundernet.com/og.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
